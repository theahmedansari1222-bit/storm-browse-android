name: Storm Stable Debug Build

on:
  workflow_dispatch:

jobs:
  stable-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components for compileSdk 37
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build stableDebug APK
        run: ./gradlew :app:assembleStableDebug --stacktrace

      - name: Upload stableDebug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: storm-stable-debug-apk
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
