name: Storm Stable Debug Build

on:
  workflow_dispatch:

jobs:
  stable-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK and install compileSdk 37
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SDK_ROOT:-}" ] && [ -n "${ANDROID_HOME:-}" ]; then
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi
          if [ -z "${ANDROID_HOME:-}" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          if [ -z "${ANDROID_SDK_ROOT:-}" ] || [ ! -d "${ANDROID_SDK_ROOT}" ]; then
            echo "Preinstalled Android SDK not found on runner."
            exit 1
          fi

          SDKMANAGER=""
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found."
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Checking availability of platforms;android-37..."
          "$SDKMANAGER" --list 2>/dev/null | grep -n "platforms;android-37" || true

          if "$SDKMANAGER" --install "platforms;android-37"; then
            echo "platforms;android-37 installed successfully."
          else
            echo "ERROR: Failed to install package 'platforms;android-37'."
            echo "Possible reason: Android SDK Platform 37 is not available in the configured SDK repositories on this runner."
            echo "Project requires compileSdk 37 (app/build.gradle). I cannot change Gradle/source/dependency versions without approval."
            echo "Available nearby platform packages:"
            "$SDKMANAGER" --list 2>/dev/null | grep -E 'platforms;android-3[0-9]|platforms;android-[0-9]+' | head -40 || true
            exit 1
          fi

          "$SDKMANAGER" --install "build-tools;35.0.0" "platform-tools" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build stableDebug APK
        run: ./gradlew :app:assembleStableDebug --stacktrace

      - name: Upload stableDebug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: storm-stable-debug-apk
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
