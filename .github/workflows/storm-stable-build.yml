name: Storm Stable Debug Build

on:
  workflow_dispatch:

jobs:
  stable-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Diagnose Android SDK 37 availability and prepare build
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SDK_ROOT:-}" ] && [ -n "${ANDROID_HOME:-}" ]; then
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi
          if [ -z "${ANDROID_HOME:-}" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          if [ -z "${ANDROID_SDK_ROOT:-}" ] || [ ! -d "${ANDROID_SDK_ROOT}" ]; then
            echo "Preinstalled Android SDK not found on runner."
            exit 1
          fi

          SDKMANAGER=""
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found."
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          echo "=== SDK Command-line Tools version/info ==="
          "$SDKMANAGER" --version || true
          find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -name source.properties -print -exec grep -H '^Pkg.Revision' {} \; 2>/dev/null || true
          find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -name package.xml -print 2>/dev/null || true

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "=== sdkmanager --list --channel=3 (Android 37 platform packages) ==="
          "$SDKMANAGER" --list --channel=3 2>&1 | tee /tmp/sdk-list-channel3.txt
          echo "=== Matching Android 37 platform entries ==="
          grep -nE 'platforms;android-37(\.0)?' /tmp/sdk-list-channel3.txt || true
          echo "=== All Android 3x platform entries (for context) ==="
          grep -nE 'platforms;android-3[0-9](\.[0-9]+)?' /tmp/sdk-list-channel3.txt || true

          if grep -qE '^\s*platforms;android-37\.0\b' /tmp/sdk-list-channel3.txt || "$SDKMANAGER" --list --channel=3 2>/dev/null | grep -q 'platforms;android-37.0'; then
            echo "RESULT: platforms;android-37.0 is AVAILABLE. Installing platforms;android-37.0..."
            "$SDKMANAGER" --channel=3 --install "platforms;android-37.0"
            "$SDKMANAGER" --install "build-tools;35.0.0" "platform-tools" || true
            echo "NOTE: Project uses compileSdk 37 (integer). Installed platforms;android-37.0 is expected to satisfy API level 37 for Gradle/AGP if the package provides API 37."
          else
            echo "RESULT: platforms;android-37.0 is NOT available in channel=3 repositories on this runner."
            echo "Project requires compileSdk 37 (app/build.gradle). I cannot change project configuration without approval."
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build stableDebug APK
        run: ./gradlew :app:assembleStableDebug --stacktrace

      - name: Upload stableDebug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: storm-stable-debug-apk
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
